[package]
name = "mbf-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.86"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
semver = { version = "1.0.23", features = ["serde"] }
mbf-zip = { path = "../mbf-zip" }
mbf-axml = { path = "../mbf-axml" }
qbsdiff = "1.4.2"
byteorder = "1.5.0"
xml = "0.8.20"
jsonschema = { version = "0.18.0", default-features = false }
const_format = "0.2.32"
log = "0.4.22"
